[project]
name = "specscore"
version = "0.1.4"
description = "OpenAPI scoring, sandbox, and CLI tool scoring for AI-ready agents — specscore"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SheepSeb" }]
keywords = [
    "openapi", "api", "ai", "agents", "scorecard",
    "mock-server", "sandbox", "llm", "agentic", "cli", "clitic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
dependencies = [
    "typer[all]>=0.9",
    "pyyaml>=6",
    "pydantic>=2",
    "openapi-spec-validator>=0.7",
    "flask>=3",
    "requests>=2.31",
]

[project.urls]
Homepage      = "https://sheepseb.github.io/specscore"
Repository    = "https://github.com/SheepSeb/specscore"
"Bug Tracker" = "https://github.com/SheepSeb/specscore/issues"

[project.scripts]
specscore = "scorecard.cli:app"

# ── Build ──────────────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["scorecard", "sandbox", "clitic"]

[tool.hatch.build.targets.wheel.force-include]
"sandbox/data/sample_spec.yaml" = "sandbox/data/sample_spec.yaml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

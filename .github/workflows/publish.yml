name: Publish to PyPI

on:
  push:
    tags:
      - "v*"          # triggers on v0.1.0, v1.2.3, etc.

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Build wheel and sdist
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reuse-api/
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC trusted publishing — no PYPI_TOKEN secret needed.
        # One-time setup required on PyPI:
        #   1. Go to https://pypi.org/manage/project/reuse-api/settings/publishing/
        #   2. Add a trusted publisher: owner=SheepSeb repo=cli-jentic workflow=publish.yml env=pypi

openapi: "3.0.3"
info:
  title: "Task Manager API"
  version: "1.0.0"
  # Intentionally missing description

paths:
  /tasks:
    get:
      operationId: "listTasks"
      summary: "List all tasks"
      description: "Returns a paginated list of all tasks belonging to the current user."
      tags: ["tasks"]
      responses:
        "200":
          description: "A list of tasks"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        # Intentionally missing 4xx/5xx responses

    post:
      # Intentionally missing operationId
      # Intentionally missing summary and description
      # Intentionally missing tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
            # Intentionally missing example
      responses:
        "201":
          description: "Task created successfully"
        "400":
          description: "Invalid input"

  /tasks/{taskId}:
    get:
      operationId: "getTask"
      summary: "Get a task by ID"
      description: "Retrieves a specific task by its unique identifier."
      tags: ["tasks"]
      parameters:
        - name: taskId
          in: path
          required: true
          # Intentionally missing description
          schema:
            type: string
      responses:
        "200":
          description: "The requested task"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
              example:
                id: "abc123"
                title: "Buy groceries"
                done: false
                createdAt: "2024-01-15T10:30:00Z"
        "404":
          description: "Task not found"

    put:
      operationId: "updateTask"
      # Intentionally missing summary and description
      # Intentionally missing tags
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
      responses:
        "200":
          description: "Task updated"
        # Intentionally missing error responses

    delete:
      # Intentionally missing operationId, summary, description, tags
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: "Task deleted"
        # Intentionally missing 404

  /users:
    get:
      operationId: "op1"   # Intentionally bad operationId
      # Intentionally missing summary, description, tags
      responses:
        "200":
          description: "OK"
          # Intentionally missing schema

  /health:
    get:
      operationId: "healthCheck"
      summary: "Health check"
      description: "Returns the current health status of the API service."
      tags: ["system"]
      responses:
        "200":
          description: "Service is healthy"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

# Intentionally no security schemes defined
# Intentionally no global security

components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: string
          # Intentionally missing description
        title:
          type: string
          description: "The task title"
        done:
          type: boolean
          # Intentionally missing description
        createdAt:
          type: string
          format: date-time
          # Intentionally missing description

    CreateTask:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          # Intentionally missing description
        done:
          type: boolean
          # Intentionally missing description
